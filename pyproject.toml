[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulseops"
version = "0.1.0"
description = "A reproducible production ML service scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "joblib>=1.4",
  "mlflow>=2.17",
  "pandas>=2.2",
  "prometheus-client>=0.21",
  "pydantic-settings>=2.6",
  "pyarrow>=13.0",
  "scikit-learn>=1.5",
  "uvicorn[standard]>=0.32",
  "dagshub>=0.3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "pytest-mock>=3.14",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I"]
